# Reverse-proxy 192.168.8.10:80 → 192.168.8.10:9000 (vllm-gateway)
#
# Used by `start-nginx-gateway.sh` which runs nginx with --network host
# so it can bind to a specific host IP and proxy to another host IP.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Don't buffer request/response bodies — gateway responses stream
    # straight to the client.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 64m;

    # Send the original client IP through; gateway uses it for logs.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generous timeouts — model inference can take a minute on long prompts.
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    server {
        # Bind ONLY to 192.168.8.10. (httpd keeps 192.168.8.62:80.)
        listen 192.168.8.10:80;

        # Liveness probe — open, no auth (gateway has /healthz).
        location = /healthz {
            proxy_pass http://192.168.8.10:9000/healthz;
        }

        # Everything else (including /v1/prompt, /readyz) → gateway.
        location / {
            proxy_pass http://192.168.8.10:9000;
        }
    }
}
